color_format = "RGBA"

[colors]
# 主窗口背景
background = "226, 208, 220, 255"
# 状态栏和面板
panel = "45, 45, 45, 255"
# 普通文字
foreground = "20, 20, 20, 255"
# 强调
accent = "255, 151, 220, 200"
# 按钮默认、悬停、按下和边框
button = "220, 136, 192, 90"
button_hover = "248, 165, 220, 200"
button_pressed = "120, 120, 120, 175"
border = "100, 100, 100, 190"
# 显示框背景、文字、边框
display_background = "255, 255, 255, 148"
display_foreground = "150, 150, 150, 255"
display_border = "220, 136, 192, 194"
