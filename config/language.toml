# randname 语言包
# 本文件只负责界面文字；主题、名单和主配置分别在 theme.toml、name.toml、config.toml。
#
# preferred 是启动首选语言；可填 en_US、zh_CN、zh_TW。
# 若这里没有写 preferred（或写的语言不存在），程序会回退到系统语言，再回退英语。
# 记忆文件中的语言偏好（若存在且有效）优先于本文件。
preferred = "zh_CN"

# 每个 languages.<locale> 是一个语言包；locale 可填 en_US、zh_CN、zh_TW 或自行添加。
# display_name 是语言菜单名称；text 左侧键名固定，只修改等号右侧译文。
# 文案中的 {count}、{name} 等格式占位符必须保留，否则运行时无法填入内容。
[languages.en_US]
display_name = "English (United States)"
[languages.en_US.text]
