# 启动首选语言；可填 en_US、zh_CN、zh_TW。缺少该语言包时回退系统语言或英语。
preferred = "zh_CN"

# 每个 languages.<locale> 是一个语言包；locale 可填 en_US、zh_CN、zh_TW 或自行添加。
# display_name 是语言菜单名称；text 左侧键名固定，只修改等号右侧译文。
# 文案中的 {count}、{name} 等格式占位符必须保留，否则运行时无法填入内容。
[languages.en_US]
display_name = "English (United States)"
[languages.en_US.text]
