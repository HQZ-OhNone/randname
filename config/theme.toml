# randname 配置文件 - GNU GPL v3.0 - Copyright (C) 2026 HQZ-OhNone
# 本文件使用 UTF-8 编码；修改后可在程序中选择“文件 > 刷新程序状态”。
# 主题目录：修改 default 可更改启动默认与无效主题的回退项；值必须匹配下方主题键。
default = "randname-dark"

# 每个主题包含 color_format、name 和 colors。color_format 可选 HexA、Hex、RGBA、RGB。
# name 下以 en_US/zh_CN/zh_TW 修改菜单显示名称；缺失时按系统语言、英语、主题键回退。
# colors 字段含 background 页面底色、foreground 文字、panel 状态栏、
# button/button_hover/button_pressed 按钮状态、border 边框、accent 菜单选中强调色。
# HexA 使用 #RRGGBBAA；Hex 使用 #RRGGBB；RGBA/RGB 使用逗号分隔的 0-255 通道。
#
# 输出框颜色由每个主题的 [themes.<键名>.output] 表控制：
#   background = 结果框底色；foreground = 结果文字；border = 结果框边框。
# 旧版的 colors.display_background/foreground/border 仍可作为后备，但不再写入本文件。
#
# 可选 titlebar 指定 Windows 标题栏颜色；省略时使用 panel 颜色。
# 可选背景图：在主题内新增 [themes.<键名>.background] 表。省略该表则不启用背景。
# image 相对 ui/ 或使用绝对路径；blur_direction 可选 uniform、horizontal、vertical、
# diagonal、center-out、out-center。未写 blur_radius 时默认 24（整张均匀模糊）。
# 菜单栏和状态栏始终使用主题底色，不显示背景图。
[themes.amber-dark]
color_format = "HexA"
[themes.amber-dark.name]
en_US = "Amber Dark"
zh_CN = "琥珀深色"
zh_TW = "琥珀深色"
[themes.amber-dark.colors]
background = "#21180FFF"
foreground = "#FFF8E7FF"
panel = "#302314FF"
button = "#49331AFF"
button_hover = "#68471FFF"
button_pressed = "#895C25FF"
border = "#A9752FFF"
accent = "#F0A500FF"

[themes.amber-dark.output]
background = "#141414FF"
foreground = "#FFFFFFFF"
border = "#4A90E2FF"

