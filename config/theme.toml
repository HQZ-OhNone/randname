# 主题目录：修改 default 可更改启动默认与无效主题的回退项；值必须匹配下方主题键。
default = "randname-dark"

# 每个主题包含 color_format、name 和 colors。color_format 可选 HexA、Hex、RGBA、RGB。
# name 下以 en_US/zh_CN/zh_TW 修改菜单显示名称；缺失时按系统语言、英语、主题键回退。
# colors 字段含 background 页面底色、foreground 文字、panel 状态栏、display_* 结果框、
# button/button_hover/button_pressed 按钮状态、border 边框、accent 菜单选中强调色。
# HexA 使用 #RRGGBBAA；Hex 使用 #RRGGBB；RGBA/RGB 使用逗号分隔的 0-255 通道。
[themes.amber-dark]
color_format = "HexA"
[themes.amber-dark.name]
en_US = "Amber Dark"
zh_CN = "琥珀深色"
zh_TW = "琥珀深色"
[themes.amber-dark.colors]
background = "#21180FFF"
foreground = "#FFF8E7FF"
panel = "#302314FF"
display_background = "#3A2918EE"
display_foreground = "#FFF8E7FF"
display_border = "#D99A2BFF"
button = "#49331AFF"
button_hover = "#68471FFF"
button_pressed = "#895C25FF"
border = "#A9752FFF"
accent = "#F0A500FF"

