# randname 主配置文件
# 本程序使用 TOML 格式；以 # 开头的内容是注释，不会影响程序。
# 修改后可在程序中选择“文件 > 刷新程序状态”立即生效；窗口尺寸等少数项目重启后生效。
#
# 图标、启动画面、帮助/日志/记忆/许可证文件的位置固定于程序代码，不再通过配置修改。
#
# 本程序是自由软件，依据 GNU GPL v3.0 发布；详见 doc/gpl-3.0.md。

[app]
# 启动后默认打开的模式。可填：
#   "Single"          单抽（等于多抽数量 1，不单独占一个页面）
#   "Multi"           多抽
#   "Lift"            减量抽
#   "ScrollSingle"    滚动单抽（等于滚动多抽数量 1）
#   "ScrollMulti"     滚动多抽
#   "ScrollLift"      滚动减量抽
# 每次启动都使用这里设置的模式。
default_mode = "ScrollMulti"

# 默认名单键名。必须存在于 config/name.toml 的 [rosters.<键名>] 中。
roster = "class_0"

[window]
# 初始窗口尺寸模式：
#   "screen_ratio" = 按可用屏幕比例计算初始尺寸
#   "fixed"        = 使用下面的 width/height
#   "maximum"      = 窗口最大化
size_mode = "maximum"

# screen_ratio 模式下的初始窗口占可用屏幕的比例，范围 0.05 到 1.0。
# 程序会同时考虑 aspect_ratio，避免窗口被拉得过宽或过高。
screen_ratio = 0.75

# 初始窗口宽/高比，必须大于 0。1.5 表示 3:2，2.0 表示 2:1。
aspect_ratio = 1.5

# size_mode = "fixed" 时使用的初始宽高，单位为逻辑像素。
width = 1000
height = 600

# 是否允许用户拖动窗口边缘拉伸。
# true = 可拉伸；false = 窗口尺寸固定。
resizable = true

# 启动后是否进入全屏（不显示标题栏与边框）。
# 为 true 时优先于上面的 size_mode；不会改写本文件。
fullscreen = false

[ui]
# 输出框字体。留空字符串表示使用界面默认字体。
font_family = ""

# 输出框基准字号（pt）。名字不长时使用这个字号。
display_font_size = 36

# 自动缩字号的下限（pt）。名字太多/太长时不会小于这个值。
display_min_font_size = 15

# 每次缩小字号的步长（pt）。越小越平滑，但计算次数越多。
display_font_step = 1

# 多行文字的行距倍数。1.0 表示默认行距。
display_line_spacing = 1.0

# 输出框内边距（像素）。改变后请确认文字没有被边框遮挡。
display_padding = 8

# 抽取按钮、增加/减少按钮、重置按钮的字号（pt）。
button_font_size = 24

# 数量显示标签的字号（pt）。
quantity_font_size = 20

[scroll]
# 滚动多抽和滚动减量抽每秒更新多少次，必须为正整数。
rate = 48

[splash]
# 是否显示启动画面。true = 显示；false = 直接进入主窗口。
enabled = true

# 启动画面关闭时机：
#   0 = 主窗口准备好后立即关闭
#   1 = 至少显示 duration_ms 毫秒，时间到后才显示主窗口
mode = 1

# mode = 1 时的最短显示时间，单位毫秒；0 表示不等待。
duration_ms = 2000

# 启动画面尺寸模式：
#   "screen_ratio" = 按可用屏幕比例缩放
#   "fixed"        = 使用下面的 width/height
size_mode = "screen_ratio"

# 启动画面占可用屏幕的比例，范围 0.05 到 1.0。
screen_ratio = 0.3

# size_mode = "fixed" 时使用的启动画面宽高，单位为逻辑像素。
# 图片会保持原始宽高比并缩放，不会拉伸变形。
width = 500
height = 250

[viewer]
# 帮助、许可证和程序日志查看器的刷新间隔，单位毫秒。
refresh_ms = 500

# 查看器正文字号（pt）。
font_size = 13

# 查看器窗口最多占桌面可用区域的比例，范围 0.3 到 1.0。
# 程序会预留边距，避免遮挡任务栏；小屏幕会自动缩小。
max_screen_ratio = 0.85

# 是否启用触屏拖动滚动。true = 可用手指拖动文本；false = 只使用滚动条/滚轮。
touch_scroll = true

[statusbar]
# 状态栏永久信息区显示哪些内容。true = 显示；false = 隐藏。
# 左侧仍会显示“抽取完成”等临时消息。
show_mode = true       # 当前模式
show_roster = true     # 当前名单
show_quantity = true   # 当前数量
show_theme = false     # 当前主题
show_language = false  # 当前语言
show_log_level = true  # 当前日志等级
show_version = true    # 程序版本

[logging]
# 写入日志文件的最低等级，可填 DEBUG、INFO、WARNING、ERROR、CRITICAL，依次由详细到简略。
# 低于该等级的记录不会写入文件，但程序日志窗口始终显示本次运行的全部等级。
level = "INFO"

[update]
# 检查更新时访问 GitHub API 的超时时间，单位毫秒，范围 1000 到 120000。
timeout_ms = 15000
