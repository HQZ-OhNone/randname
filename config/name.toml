# 本文件使用 UTF-8 编码；修改后可在程序中选择“文件 > 刷新程序状态”。
# 名单目录：每个 rosters.<键名> 是一组名单，键名需唯一且供 app.roster 引用。
# name 表填写该名单的显示名称；新增其他语言时使用相同的 locale 代码。
[rosters.class_1.name]
en_US = "Example Class"
zh_CN = "示例班级"
zh_TW = "示例班級"

# names 表的键是稳定且唯一的人员编号，值是界面中显示的姓名。
# 可增删条目或整组 roster；请勿在同一名单中重复编号。
[rosters.class_1.names]
"0" = "周〇"
"1" = "张三"
"2" = "李四"
"3" = "王五"
"4" = "赵六"
"5" = "孙七"
"6" = "周八"
"7" = "吴九"
"8" = "郑睿"