name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================================
  # 清理废弃缓存（独立 job，可通过 workflow_dispatch 手动触发）
  # ============================================================
  clear-caches:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete all caches
        run: gh cache delete --all --repo ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # 提取版本号
  # ============================================================
  extract-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

  # ============================================================
  # Linux 构建
  # ============================================================
  build-linux:
    needs: extract-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
#          cache-dependency-path: '**/requirements*.txt'

      - name: Install Nuitka cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/nuitka
          key: ${{ runner.os }}-nuitka-${{ hashFiles('**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
#          pip install -r requirements.txt

      - name: Build with Nuitka
        run: |
          python -m nuitka \
            --standalone \
            --enable-plugin=pyside6 \
            --include-data-dir=config=config \
            --include-data-dir=ui=ui \
            --include-data-dir=doc=doc \
            --output-dir=build \
            --output-filename=randname \
            --show-progress \
            --lto=yes \
            --assume-yes-for-downloads \
            main.py

      - name: Verify artifact exists
        run: |
          if [ ! -f "build/randname.dist/randname" ] && [ ! -f "build/randname.dist/randname.bin" ]; then
            echo "::error::Nuitka build failed - executable not found!"
            exit 1
          fi

      - name: Package artifact
        run: |
          cd build/randname.dist
          tar -czf ../../randname-linux.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: randname-linux
          path: randname-linux.tar.gz

  # ============================================================
  # Windows 构建（重点修复）
  # ============================================================
  build-windows:
    needs: extract-version
    runs-on: windows-latest
    env:
      # 关键：避免 Windows 上 Nuitka 依赖下载交互卡死
      NUITKA_ASSUME_YES_FOR_DOWNLOADS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'
#          cache-dependency-path: '**/requirements*.txt'

      - name: Install Nuitka cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\cache
          key: ${{ runner.os }}-nuitka-${{ hashFiles('**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
#          pip install -r requirements.txt

      - name: Build with Nuitka
        run: |
          python -m nuitka `
            --standalone `
            --enable-plugin=pyside6 `
            --include-data-dir=config=config `
            --include-data-dir=ui=ui `
            --include-data-dir=doc=doc `
            --output-dir=build `
            --output-filename=randname.exe `
            --show-progress `
            --lto=yes `
            --assume-yes-for-downloads `
            --windows-disable-console `
            main.py

      - name: Verify artifact exists
        run: |
          if (-not (Test-Path "build/randname.dist/randname.exe")) {
            Write-Error "Nuitka build failed - executable not found!"
            exit 1
          }

      - name: Package artifact (PowerShell Compress-Archive)
        run: |
          Compress-Archive -Path "build/randname.dist/*" -DestinationPath "randname-windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: randname-windows
          path: randname-windows.zip

  # ============================================================
  # 发布
  # ============================================================
  release:
    needs: [extract-version, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ needs.extract-version.outputs.version }}
          files: |
            artifacts/randname-linux/randname-linux.tar.gz
            artifacts/randname-windows/randname-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
