# randname 默认配置；doc/config.toml 缺失或损坏时只读使用。

[app]
name = "randname"
version = "1.0.0"
default_mode = "ScrollSingle"
theme = "dark"

[window]
width = 800
height = 600

[scroll_single]
# 每秒刷新次数。
rate = 30

[names]
"0" = "周〇"
"1" = "张三"
"2" = "李四"
"3" = "王五"
"4" = "赵六"
"5" = "孙七"
"6" = "周八"
"7" = "吴九"
"8" = "郑睿"
